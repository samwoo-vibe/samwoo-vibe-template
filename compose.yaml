services:
  frontend:
    build:
      context: ./frontend
      args:
        NODE_OPTIONS: --max-old-space-size=1536
    # Coolify applies its app-wide env file to every Compose service. A nonempty
    # sentinel overrides backend-only secrets in the public web container; an
    # empty/null value would be filled again from the project environment.
    environment:
      DATABASE_URL: "__NOT_AVAILABLE_IN_FRONTEND__"
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be configured in Coolify}
    user: "101:101"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    labels:
      # 프로비저너가 Coolify native Compose 시작 경로를 보장하고 그 경로가 앱 UUID를
      # 제공한다. 공통 fallback은 없으므로 값이 없으면 Compose 해석 단계에서 실패한다.
      traefik.docker.network: ${COOLIFY_RESOURCE_UUID:?COOLIFY_RESOURCE_UUID must be provided by Coolify}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    # 실측 후 조정한다(사내 배포 규약 R3-6, 13장). 타입 검사·번들링은 메모리를 많이 쓴다.
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256

  backend:
    build: ./backend
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be configured in Coolify}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be configured in Coolify}
      APP_ENV: ${APP_ENV:-dev}
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    networks:
      - default
      - database

networks:
  database:
    external: true
    name: samwoo-postgres-prod
