services:
  frontend:
    build:
      context: ./frontend
      args:
        NODE_OPTIONS: --max-old-space-size=1536
    # Coolify applies its app-wide env file to every Compose service. A nonempty
    # sentinel overrides backend-only secrets in the public web container; an
    # empty/null value would be filled again from the project environment.
    environment:
      DATABASE_URL: "__NOT_AVAILABLE_IN_FRONTEND__"
      APP_BASE_URL: ${APP_BASE_URL:-}
    user: "101:101"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    labels:
      # 프로비저너가 Coolify native Compose 시작 경로를 보장하고 그 경로가 앱 UUID를
      # 제공한다. 공통 fallback은 없으므로 값이 없으면 Compose 해석 단계에서 실패한다.
      traefik.docker.network: ${COOLIFY_RESOURCE_UUID:?COOLIFY_RESOURCE_UUID must be provided by Coolify}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    # 실측 후 조정한다(사내 배포 규약 R3-6, 13장). 타입 검사·번들링은 메모리를 많이 쓴다.
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256

  backend:
    build: ./backend
    # uvicorn이 PID 1이면 헬스체크 타임아웃으로 고아가 된 python을 거두지 못해 좀비가 쌓인다.
    init: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Coolify 4.5는 `docker compose build` 때 빌드 시점 변수만으로 이 파일 전체를 해석한다.
    # 런타임 전용 값(DATABASE_URL·APP_BASE_URL·비밀값)은 `${KEY:-}`로 두고, 비어 있으면 앱이
    # 기동할 때 즉시 실패한다. `${KEY:?...}`는 빌드가 실패하고 `${KEY:-값}`은 프로비저너가 거부한다.
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      APP_ENV: ${APP_ENV:-dev}
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      # Each probe starts a fresh Python (~0.3s CPU). During start_period Docker probes every 5s,
      # so a 60s interval does not delay first-healthy detection on deploy.
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 60s
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    networks:
      - default
      - database

networks:
  database:
    external: true
    name: samwoo-postgres-prod
