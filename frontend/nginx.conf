map $http_x_forwarded_proto $public_scheme {
    default $scheme;
    https   https;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Every generated app must revalidate the SPA shell while keeping Vite's
# content-hashed assets cacheable. API responses are never browser-cached.
map $uri $cache_control {
    default          "no-cache";
    "/index.html"    "no-cache, no-store, must-revalidate";
    ~^/api(?:/|$)    "no-store";
    ~^/assets/       "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    # Allow company messenger tool windows. Keep headers at server scope:
    # any location-level add_header would replace this entire inherited set.
    add_header Content-Security-Policy "frame-ancestors 'self' https://play-on.samwooeleco.com https://mattermost-wpjh.srv1808091.hstgr.cloud" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/api(?:/|$) {
        # Keep /api in the upstream request path. FastAPI's root_path removes it
        # for route matching while Starlette retains it in redirect URLs.
        client_max_body_size 50m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Uvicorn trusts this dynamically addressed frontend proxy. Never append
        # a client-supplied chain: replace it with the direct proxy peer so an
        # application cannot mistake an attacker-controlled value for identity.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
